[tools]
ruby = "3"

[env]
CLIENT_ID = { required = "Set CLIENT_ID to your Spotify App Client ID in mise.local.toml" }
CLIENT_SECRET = { required = "Set CLIENT_SECRET to your Spotify App Client Secret in mise.local.toml" }
LASTFM_API_KEY = { required = "Set LASTFM_API_KEY to your last.fm API key" }
LASTFM_SHARED_SECRET = {required = "Set LASTFM_SHARED_SECRET to your last.fm shared secret"}

[tasks.reqs]
description = "Install project dependencies"
run = "bundle install"

[tasks.prod]
description = "Start jeyll prod server"
run = "bundle exec jekyll serve"

[tasks.dev]
description = "Start jekyll dev server"
run = "bundle exec jekyll serve --drafts"

[tasks.update-vinyls]
description = "Fetch vinyl cover art from Spotify API"
run = "ruby scripts/fetch_spotify_albums.rb src/_data/vinyls.yml"

[tasks.update-books]
description = "Fetch vinyl cover art from Spotify API"
run = "ruby scripts/parse_storygraph_books.rb"