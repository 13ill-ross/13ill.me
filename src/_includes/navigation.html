<nav class="sidebar" aria-label="Main Navigation">
  {% for group in site.data.navigation.groups %}
  <div class="nav-group">
    <h2>{{group.name}}</h2>
    <ul>
      {% for item in group.items %}
      <li>
        <a href="{{item.link}}" {% if page.url==item.link %} class="active" {% endif %}>{{item.name}}</a>
      </li>
      {% endfor %}
    </ul>
  </div>
  {% endfor %}
</nav>
